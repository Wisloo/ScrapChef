name: scrap_chef
description: MVP for food scrap recognition, inventory, and recipe guidance.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '^3.11.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.0.0
  image: ^4.0.17
  path_provider: ^2.1.1
  google_fonts: ^6.2.1
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  connectivity_plus: ^6.0.0
  google_generative_ai: ^0.4.7
  http: ^1.2.0
  shared_preferences: ^2.2.2
  flutter_dotenv: ^6.0.1
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/image/ScrapChefLogo.jpg
    - .env
