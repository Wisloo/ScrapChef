name: scrap_chef
description: MVP for food scrap recognition, inventory, and recipe guidance.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.0.0
  # tflite_flutter: ^0.10.4  # Temporarily disabled for testing
  image: ^4.0.17
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/food_classifier_full.tflite
    - assets/models/class_names_full.txt
